name: ics-security-assessment-lab

services:
  openplc:
    image: ghcr.io/autonomy-logic/openplc-runtime:latest
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - openplc_data:/var/run/runtime
    networks:
      - control

  fuxa:
    image: frangoteam/fuxa:latest
    ports:
      - "127.0.0.1:1881:1881"
    volumes:
      - fuxa_appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa_db:/usr/src/app/FUXA/server/_db
      - fuxa_logs:/usr/src/app/FUXA/server/_logs
      - fuxa_images:/usr/src/app/FUXA/server/_images
    networks:
      - control

  modbus-probe:
    image: python:3.12-alpine
    profiles:
      - verify
    volumes:
      - ../tools/modbus_probe.py:/probe.py:ro
    command: ["python", "/probe.py", "--host", "openplc", "--port", "5020"]
    networks:
      - control

  modbus-pump-check:
    image: python:3.12-alpine
    profiles:
      - verify
    volumes:
      - ../tools:/tools:ro
    command: ["python", "/tools/modbus_pump_check.py"]
    networks:
      - control

  modbus-capture:
    image: nicolaka/netshoot:v0.16
    profiles:
      - capture
    network_mode: "service:openplc"
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    volumes:
      - ../../evidence/baseline:/capture
    command: ["tcpdump", "-i", "eth0", "-p", "-nn", "-s", "0", "-U", "-c", "80", "-w", "/capture/fuxa-openplc-baseline.pcap", "tcp", "port", "5020"]
    depends_on:
      - openplc

networks:
  control:

volumes:
  openplc_data:
  fuxa_appdata:
  fuxa_db:
  fuxa_logs:
  fuxa_images:
